<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECO - Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <main class="pagina-login">

    <a href="index.html" class="logo">
      <span><img src="IMG/LogoEco.jpg" width="80"></span> ECO
    </a>

    <section class="login-card">
      <div class="login-cabecalho">
        <div class="icone-login">♧</div>
        <h1>Bem-vindo!</h1>
        <p>Entre na sua conta para continuar.</p>
      </div>

      <form action="#" method="post">

        <div class="campo">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Digite seu e-mail"
            required
          >
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            required
          >
        </div>

        <button type="submit" class="botao-entrar">
          Entrar
        </button>

        <p class="cadastro">
          Ainda não tem uma conta?
          <a href="cadastro.html">Cadastre-se</a>
        </p>

      </form>
    </section>

    <a href="index.html" class="voltar">← Voltar ao início</a>

  </main>

</body>
</html>
